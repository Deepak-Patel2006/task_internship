<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Stopwatch</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<style>
    body {
  margin: 0;
  font-family: Arial;
  background: #0e0c1c;
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.container {
  text-align: center;
  background: #1e1b3a;
  padding: 30px;
  border-radius: 12px;
  width: 350px;
}

h1 {
  margin-bottom: 20px;
}

#display {
  font-size: 40px;
  margin-bottom: 20px;
  letter-spacing: 2px;
}

.buttons {
  display: flex;
  justify-content: space-between;
  margin-bottom: 20px;
}

button {
  flex: 1;
  margin: 5px;
  padding: 10px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-weight: bold;
}

#start {
  background: #4caf50;
  color: white;
}

#pause {
  background: #ff9800;
  color: white;
}

#reset {
  background: #f44336;
  color: white;
}

#lap {
  background: #2196f3;
  color: white;
}

.laps {
  text-align: left;
}

.laps ul {
  list-style: none;
  padding: 0;
  max-height: 150px;
  overflow-y: auto;
}

.laps li {
  background: #2a2750;
  padding: 8px;
  border-radius: 5px;
  margin-bottom: 5px;
}
</style>
  <div class="container">
    <h1>⏱️ Stopwatch</h1>

    <!-- Time Display -->
    <div id="display">00:00:00</div>

    <!-- Buttons -->
    <div class="buttons">
      <button id="start">Start</button>
      <button id="pause">Pause</button>
      <button id="reset">Reset</button>
      <button id="lap">Lap</button>
    </div>

    <!-- Lap List -->
    <div class="laps">
      <h3>Lap Times</h3>
      <ul id="lapList"></ul>
    </div>
  </div>

  <script src="stopwatch.js"></script>
</body>
</html>
